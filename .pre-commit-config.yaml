# Runs on every commit. Installed by `make setup`, or by hand:
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: ["--fix"]
        types_or: [python, jupyter]
      - id: ruff-format
        types_or: [python, jupyter]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        # The submitted notebook under notebooks/final/ keeps its outputs.
        exclude: ^notebooks/final/
  - repo: local
    hooks:
      - id: mypy-src
        name: mypy on src/
        entry: .venv/bin/mypy src/
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
      - id: ascii-only-docs
        name: docs and notebooks are plain ASCII
        entry: python3 scripts/check_ascii.py
        language: system
        files: ^(README\.md|docs/.*\.md|notebooks/.*\.ipynb)$
      - id: notebooks-clean
        name: dev notebooks carry no outputs
        entry: python3 scripts/check_notebooks_clean.py
        language: system
        files: ^notebooks/dev/.*\.ipynb$
